name: backend-sql-tests

# Menjalankan migrasi 0001-0005 + pgTAP negative tests di tiap push yang
# menyentuh supabase/. Tanpa secret, tanpa database production (postgres CI saja).
on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/backend-sql-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for postgres
        env:
          PGPASSWORD: postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break || sleep 2
          done

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
          PGOPTIONS: "-c search_path=public,extensions"
        run: |
          set +e
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/ci_auth_stub.sql > apply.log 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::STUB FAILED: $(grep -iE 'error|fatal' apply.log | head -3 | cut -c1-400)"
            cat apply.log
            exit 1
          fi
          for m in 0001_baseline 0002_rls_phase5 0003_grant_reward 0004_instances 0005_security_hardening 0006_rbac_crud; do
            echo "Applying $m"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -f supabase/migrations/$m.sql > apply.log 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::APPLY $m FAILED: $(grep -iE 'error|fatal' apply.log | head -3 | cut -c1-400)"
              cat apply.log
              exit 1
            fi
          done
          echo 'MIGRATIONS OK'

      - name: Run pgTAP tests
        env:
          PGPASSWORD: postgres
          PGOPTIONS: "-c search_path=public,extensions"
        run: |
          : > tap.out
          for t in supabase/tests/*_tests.sql; do
            echo "Running $t"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -f "$t" >> tap.out 2>&1 || true
          done
          cat tap.out
          if grep -qE '^not ok' tap.out || grep -qiE 'psql:.*(ERROR|FATAL)' tap.out; then
            echo "::error::PGTAP FAILURES: $(grep -E '^not ok' tap.out | head -5 | cut -c1-300) // ERR: $(grep -iE 'ERROR|FATAL' tap.out | head -4 | cut -c1-300)"
            echo 'PGTAP TESTS FAILED'
            exit 1
          fi
          echo 'PGTAP TESTS GREEN'
